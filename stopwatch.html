<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>計時秒錶</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      background: white;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      text-align: center;
      min-width: 300px;
    }

    h1 {
      color: #333;
      margin-bottom: 30px;
      font-size: 28px;
    }

    #display {
      font-size: 72px;
      font-weight: bold;
      color: #667eea;
      font-family: 'Courier New', monospace;
      margin-bottom: 40px;
      letter-spacing: 4px;
    }

    .controls {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    button {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #startBtn {
      background: #667eea;
      color: white;
    }

    #startBtn:hover {
      background: #5568d3;
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
    }

    #resetBtn {
      background: #f0f0f0;
      color: #333;
      border: 2px solid #ddd;
    }

    #resetBtn:hover {
      background: #e8e8e8;
      border-color: #bbb;
      transform: translateY(-2px);
    }

    button:active {
      transform: translateY(0);
    }

    .info {
      color: #999;
      font-size: 14px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>⏱️ 計時秒錶</h1>
    <div id="display">00:00:00</div>
    <div class="controls">
      <button id="startBtn">
        <i class="fas fa-play"></i>開始
      </button>
      <button id="resetBtn">
        <i class="fas fa-redo"></i>重置
      </button>
    </div>
    <div class="info">點擊「開始」計時，「重置」清空</div>
  </div>

  <script>
    let totalMs = 0;
    let isRunning = false;
    let startTime = 0;

    const display = document.getElementById('display');
    const startBtn = document.getElementById('startBtn');
    const resetBtn = document.getElementById('resetBtn');

    function formatTime(ms) {
      const totalSeconds = Math.floor(ms / 1000);
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    }

    function updateDisplay() {
      const currentMs = isRunning ? totalMs + (Date.now() - startTime) : totalMs;
      display.textContent = formatTime(currentMs);
    }

    function animationLoop() {
      if (isRunning) {
        updateDisplay();
      }
      requestAnimationFrame(animationLoop);
    }

    startBtn.addEventListener('click', () => {
      if (!isRunning) {
        startTime = Date.now();
        isRunning = true;
        startBtn.innerHTML = '<i class="fas fa-pause"></i>暫停';
      } else {
        totalMs += Date.now() - startTime;
        isRunning = false;
        startBtn.innerHTML = '<i class="fas fa-play"></i>繼續';
      }
    });

    resetBtn.addEventListener('click', () => {
      isRunning = false;
      totalMs = 0;
      startTime = 0;
      startBtn.innerHTML = '<i class="fas fa-play"></i>開始';
      updateDisplay();
    });

    animationLoop();
  </script>
</body>
</html>
